<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <link rel="stylesheet" href="../filecss/dangnhap.css">

    <!-- LIÊN KẾT FILE JS -->
    <script src="../filejs/auth.js" defer></script>
</head>
<body>

    <!-- =========================
         SECTION ĐĂNG NHẬP
    ========================== -->
    <section id="loginSection">
        <form id="loginForm">
            <h2>Đăng nhập</h2>

            <div class="input-group">
                <label for="username">Tên đăng nhập hoặc Email:</label>
                <input type="text" id="username" required>
            </div>

            <div class="input-group">
                <label for="password">Mật khẩu:</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit">Đăng nhập</button>
        </form>

        <!-- KHU VỰC CHỌN ĐĂNG KÝ -->
        <div class="register-options">
            <p>--- Đăng ký tài khoản mới ---</p>

            <button id="showRegisterUser" data-role="user">
                Đăng ký với tư cách Người dùng
            </button>

            <button id="showRegisterShipper" data-role="shipper">
                Đăng ký với tư cách Người vận chuyển
            </button>
        </div>
    </section>


    <!-- =========================
         SECTION ĐĂNG KÝ
    ========================== -->
    <section id="registerSection" style="display: none;">
        <form id="registerForm">
            <h2>
                Đăng ký tài khoản
                <span id="registerRoleDisplay">(Người dùng)</span>
            </h2>

            <!-- ROLE ẨN (JS SẼ GÁN user / shipper) -->
            <input type="hidden" id="regRole" value="user">

            <div class="input-group">
                <label for="regUsername">Tên đăng nhập:</label>
                <input type="text" id="regUsername" required>
            </div>

            <div class="input-group">
                <label for="regPassword">Mật khẩu:</label>
                <input type="password" id="regPassword" required>
            </div>

            <div class="input-group">
                <label for="regConfirmPassword">Xác nhận mật khẩu:</label>
                <input type="password" id="regConfirmPassword" required>
            </div>

            <button type="submit">Hoàn tất Đăng ký</button>
            <button type="button" id="backToLogin">Quay lại đăng nhập</button>
        </form>
    </section>

</body>
</html>
